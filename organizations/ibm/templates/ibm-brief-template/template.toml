[meta]
name        = "IBM Brief"
slug        = "ibm-brief-template"
version     = "2.0.0"
description = "Template IBM editorial para dossiês e relatórios técnicos, com sumário, ledger de métricas, marginália, comparação e colofão."
author      = "IBM Presentation Factory"

[design]
system      = "IBM Carbon Design System v11"
fonts       = ["IBM Plex Sans", "IBM Plex Mono"]
base_size   = "18px"
grid        = "8px"
theme       = "light"
contrast    = "WCAG 2.1 AA"

[slides]
count  = 8
labels = [
  "cover",
  "agenda",
  "metric-ledger",
  "brief-marginalia",
  "signal-chain",
  "comparison-table",
  "statement",
  "closing-colophon"
]

[assets]
# Template autônomo: copie index.html e toda a pasta assets/.
# CSS gerado por tools/sync_template_assets.py; JavaScript compartilhado em
# organizations/ibm/assets/js/deck.js. Fontes IBM Plex via Google Fonts.
