  - path: logo_negativo_serpro.svg
    type: logo
    owner: Serpro
    source: https://www.serpro.gov.br/menu/quem-somos/marca-serpro/formatos-marca
    purpose: official Serpro logo, negative version, for dark or high-contrast areas
